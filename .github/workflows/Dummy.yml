# This is a basic workflow to help you get started with Actions

name: Terraform infrs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: terraform_init
        run: terraform init
        
      - name: terraform_plan
        run: terraform plan      
        

        
        
        
      
